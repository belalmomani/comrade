name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.GHOST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ghost.keystore"
            echo "GHOST_KEYSTORE_PATH=$RUNNER_TEMP/ghost.keystore" >> "$GITHUB_ENV"
            echo "Using the stable signing key"
          else
            echo "::warning::Secret GHOST_KEYSTORE_BASE64 is missing - using a random debug key, the APK cannot update over a previous install"
          fi

      - name: Build debug APK
        env:
          GHOST_KEYSTORE_PASSWORD: ${{ secrets.GHOST_KEYSTORE_PASSWORD }}
          GHOST_AI_KEYS: ${{ secrets.GHOST_AI_KEYS }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CuteGhost-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
