name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK مثبّت مسبقًا في ubuntu-latest (ANDROID_HOME)، فلا حاجة لخطوة setup-android.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diskati-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Format check
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then echo "Files needing gofmt:"; echo "$files"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build diskati.exe
        run: go build -trimpath -ldflags "-s -w -X main.version=0.4.0" -o diskati.exe ./cmd/diskati

      - name: Smoke test on real Windows (start, status, disks, stop)
        shell: pwsh
        run: |
          $env:DISKATI_DATA_DIR = Join-Path $env:RUNNER_TEMP "diskati-data"
          $env:DISKATI_PORT = "47831"
          .\diskati.exe start
          .\diskati.exe status
          Write-Host "--- TLS handshake with the phone endpoint (informational)"
          try {
            $c = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 47831)
            $ssl = New-Object System.Net.Security.SslStream($c.GetStream(), $false, ([System.Net.Security.RemoteCertificateValidationCallback]{ $true }))
            $ssl.AuthenticateAsClient("localhost")
            Write-Host "TLS OK, protocol: $($ssl.SslProtocol)"
            $ssl.Dispose(); $c.Dispose()
          } catch { Write-Host "TLS check failed: $_" }
          Write-Host "--- real disks reported by this runner:"
          .\diskati.exe disks
          .\diskati.exe stop
          .\diskati.exe status
          if ($LASTEXITCODE -ne 1) { throw "expected 'not running' exit code 1 after stop, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v4
        with:
          name: diskati-windows-exe
          path: windows-companion/diskati.exe
          if-no-files-found: error
