name: Build for Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare upload key
        env:
          KEYSTORE_B64: ${{ secrets.GHOST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ghost.keystore"
            echo "GHOST_KEYSTORE_PATH=$RUNNER_TEMP/ghost.keystore" >> "$GITHUB_ENV"
            echo "Using the upload key"
          else
            echo "::warning::Secret GHOST_KEYSTORE_BASE64 is missing - the bundle will be UNSIGNED and Google Play will reject it"
          fi

      - name: Build release bundle (AAB for Google Play)
        env:
          GHOST_KEYSTORE_PASSWORD: ${{ secrets.GHOST_KEYSTORE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: gradle bundleRelease --stacktrace

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: CuteGhost-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build debug APK (for testing on a phone only)
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CuteGhost-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
